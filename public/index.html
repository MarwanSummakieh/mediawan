<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#151918" />
    <title>Mediawan</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/vendor/hls.min.js"></script>
    <script defer src="/app.bundle.js"></script>
  </head>
  <body>
    <div id="shell">
      <aside id="sidebar">
        <a class="brand" href="#/">mediawan</a>
        <nav aria-label="Main navigation">
          <a href="#/" data-nav="home">Home</a><a href="#/discover" data-nav="discover">Discover</a
          ><a href="#/library" data-nav="library">Library</a
          ><a href="#/list" data-nav="list">My List</a
          ><a href="#/downloads" data-nav="downloads">Downloads</a>
        </nav>
        <div class="sidebar-bottom">
          <a href="#/settings">Settings</a><button id="signout" class="text-button">Sign out</button
          ><span id="account"></span>
        </div>
      </aside>
      <main id="main" tabindex="-1"><p class="loading">Opening your library…</p></main>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="dialog">
      <div id="dialog-content"></div>
      <button id="dialog-close" class="quiet">Close</button>
    </dialog>
    <section id="player" hidden aria-label="Media player">
      <header>
        <button id="player-close">Back to library</button>
        <div><strong id="player-title"></strong><span id="player-episode"></span></div>
        <button id="player-queue">Queue</button>
      </header>
      <video id="video" playsinline></video>
      <div id="player-transport" aria-label="Playback controls">
        <div class="playback-times">
          <span id="player-time">0:00 / 0:00</span><span id="player-buffering" role="status"></span>
        </div>
        <input
          id="player-seek"
          type="range"
          min="0"
          max="0"
          step="1"
          value="0"
          aria-label="Playback position"
        />
        <div class="transport-buttons">
          <button id="player-toggle">Play</button>
          <button id="player-back" aria-label="Rewind 10 seconds">−10s</button>
          <button id="player-forward" aria-label="Forward 10 seconds">+10s</button>
          <button id="player-mute">Mute</button>
          <label class="player-volume"
            >Volume<input id="player-volume" type="range" min="0" max="1" step="0.05" value="1"
          /></label>
          <button id="player-fullscreen">Fullscreen</button>
        </div>
      </div>
      <div id="player-controls">
        <button id="previous">Previous</button><button id="next">Next episode</button
        ><label>Audio<select id="audio"></select></label
        ><label>Subtitles<select id="subtitles"></select></label
        ><button id="convert">Compatibility playback</button><button id="chapters">Chapters</button>
      </div>
      <div id="player-message" role="status"></div>
      <div id="up-next" hidden>
        <span id="up-next-label"></span><button id="up-next-play">Play now</button
        ><button id="up-next-cancel">Cancel</button>
      </div>
    </section>
  </body>
</html>
