<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#00050d" />
    <title>Mediawan</title>
    <link rel="icon" href="/favicon.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <script defer src="/vendor/hls.min.js"></script>
    <script defer src="/app.bundle.js"></script>
  </head>
  <body>
    <div id="shell">
      <header id="sidebar">
        <a class="brand" href="#/" aria-label="Mediawan home">mediawan</a>
        <nav aria-label="Main navigation">
          <a href="#/" data-nav="home">Home</a><a href="#/discover" data-nav="discover">Discover</a
          ><a href="#/library" data-nav="library">Library</a
          ><a href="#/list" data-nav="list">My List</a
          ><a href="#/sports" data-nav="sports">Live sports</a>
        </nav>
        <div class="header-tools">
          <a
            class="header-search"
            href="#/discover"
            aria-label="Search titles"
            title="Search titles"
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5" />
              <path d="m16 16 5 5" /></svg
          ></a>
          <details class="account-menu">
            <summary aria-label="Account menu">
              <span class="avatar" id="avatar" aria-hidden="true">M</span
              ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m7 10 5 5 5-5" /></svg>
            </summary>
            <div class="account-panel">
              <span id="account"></span><a href="#/downloads" data-nav="downloads">Downloads</a
              ><a href="#/settings" data-nav="settings">Settings</a
              ><button id="signout" class="text-button">Sign out</button>
            </div>
          </details>
        </div>
      </header>
      <main id="main" tabindex="-1"><p class="loading">Opening your library…</p></main>
    </div>
    <div id="toast" role="status" hidden></div>
    <dialog id="dialog">
      <div id="dialog-content"></div>
      <button id="dialog-close" class="quiet">Close</button>
    </dialog>
    <section id="player" hidden aria-label="Media player" tabindex="-1">
      <header>
        <button
          id="player-close"
          class="player-icon"
          aria-label="Back to library"
          title="Back to library"
        ></button>
        <div><strong id="player-title"></strong><span id="player-episode"></span></div>
      </header>
      <video id="video" playsinline></video>
      <div id="subtitle-layer" hidden aria-hidden="true"></div>
      <div id="player-loading" hidden role="status">
        <span class="player-spinner"></span><span id="player-buffering"></span>
      </div>
      <div id="player-transport" aria-label="Playback controls">
        <div id="player-message" role="status"></div>
        <input
          id="player-seek"
          type="range"
          min="0"
          max="0"
          step="1"
          value="0"
          aria-label="Playback position"
        />
        <div class="transport-buttons">
          <div class="transport-primary">
            <button
              id="player-toggle"
              class="player-icon"
              aria-label="Play"
              title="Play (Space)"
            ></button>
            <button
              id="player-back"
              class="player-icon"
              aria-label="Rewind 10 seconds"
              title="Rewind 10 seconds"
            ></button>
            <button
              id="player-forward"
              class="player-icon"
              aria-label="Forward 10 seconds"
              title="Forward 10 seconds"
            ></button>
            <div class="player-volume">
              <button
                id="player-mute"
                class="player-icon"
                aria-label="Mute"
                title="Mute (M)"
              ></button>
              <input
                id="player-volume"
                aria-label="Volume"
                type="range"
                min="0"
                max="1"
                step="0.05"
                value="1"
              />
            </div>
            <span id="player-time">0:00 / 0:00</span>
          </div>
          <div id="player-controls">
            <button
              id="previous"
              class="player-icon"
              aria-label="Previous episode"
              title="Previous episode"
            ></button>
            <button
              id="next"
              class="player-icon"
              aria-label="Next episode"
              title="Next episode"
            ></button>
            <button
              id="player-queue"
              class="player-icon"
              aria-label="Episode queue"
              title="Episode queue"
            ></button>
            <button
              id="chapters"
              class="player-icon"
              aria-label="Chapters"
              title="Chapters"
            ></button>
            <button
              id="player-subtitles-toggle"
              class="player-icon"
              aria-label="Subtitles"
              title="Subtitles (C)"
              aria-expanded="false"
              aria-controls="player-subtitles"
            >
              CC
            </button>
            <button
              id="player-settings-toggle"
              class="player-icon"
              aria-label="Playback settings"
              title="Audio, subtitles & playback"
              aria-expanded="false"
              aria-controls="player-settings"
            ></button>
            <button
              id="player-fullscreen"
              class="player-icon"
              aria-label="Fullscreen"
              title="Fullscreen (F)"
            ></button>
          </div>
        </div>
        <div id="player-settings" hidden role="region" aria-label="Playback settings">
          <div class="player-settings-heading">
            <strong>Playback settings</strong
            ><button
              id="player-settings-close"
              class="player-icon"
              aria-label="Close playback settings"
              title="Close settings"
            ></button>
          </div>
          <label>Audio<select id="audio"></select></label>
          <button id="player-subtitles-settings">Subtitles & appearance</button>
          <button id="convert">Compatibility playback</button>
        </div>
        <div id="player-subtitles" hidden role="region" aria-label="Subtitles">
          <div class="player-settings-heading">
            <strong>Subtitles</strong
            ><button
              id="player-subtitles-close"
              class="player-icon"
              aria-label="Close subtitles"
            ></button>
          </div>
          <label
            >Track<select id="subtitles">
              <option value="">Off</option>
            </select></label
          >
          <p id="subtitle-status" class="meta" role="status"></p>
          <button id="subtitle-find">Find online subtitles</button>
          <label class="subtitle-file"
            >Open subtitle file<input
              id="subtitle-file"
              type="file"
              accept=".srt,.vtt,text/vtt,application/x-subrip"
          /></label>
          <label
            >Subtitle file encoding<select id="subtitle-file-encoding">
              <option value="">Automatic</option>
              <option value="ara">Arabic (Windows-1256)</option>
            </select></label
          >
          <label
            >Delay (seconds)<input
              id="subtitle-delay"
              type="number"
              min="-120"
              max="120"
              step="0.5"
              value="0"
          /></label>
          <p class="meta">Negative: earlier. Positive: later.</p>
          <button id="subtitle-sync-reset">Reset timing</button>
          <details id="subtitle-appearance">
            <summary>Appearance</summary>
            <label>Text size<select id="subtitle-size"></select></label>
            <label>Text colour<select id="subtitle-color"></select></label>
            <label>Background<select id="subtitle-bg"></select></label>
            <label
              >Background opacity<select id="subtitle-bg-opacity">
                <option value="0">Transparent</option>
                <option value="0.25">25%</option>
                <option value="0.5">50%</option>
                <option value="0.75">75%</option>
                <option value="1">100%</option>
              </select></label
            >
            <label
              >Height above bottom (%)<input
                id="subtitle-pos"
                type="number"
                min="0"
                max="80"
                step="2"
                value="6"
            /></label>
            <label
              >Alignment<select id="subtitle-align">
                <option value="left">Left</option>
                <option value="center">Centre</option>
                <option value="right">Right</option>
              </select></label
            >
            <button id="subtitle-style-reset">Reset appearance</button>
          </details>
        </div>
      </div>
      <div id="up-next" hidden>
        <span id="up-next-label"></span><button id="up-next-play">Play now</button
        ><button id="up-next-cancel">Cancel</button>
      </div>
    </section>
  </body>
</html>
