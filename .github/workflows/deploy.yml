# Build a production image on every push to main and publish it to GHCR.
#
# There is no PUSH half to this deploy. GitHub cannot reach the NAS: the box has
# no inbound path at all — the Cloudflare tunnel is an outbound connection, and
# that is deliberate. So CI's job ends at the registry, and the NAS pulls. A
# Watchtower container beside the app (see docker-compose.yml) polls this
# package and restarts `web` when the digest behind :latest moves, which is the
# same event as a merge to main.
#
# Nothing here needs a secret. GITHUB_TOKEN is minted per run and is enough to
# push to this repository's own package.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:   # a manual re-run, for when the NAS needs a known image rebuilt

concurrency:
  # Two merges in quick succession must not race to publish :latest. Queue them
  # instead of cancelling — a cancelled run can leave the tag pointing at the
  # older of the two builds.
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  image:
    name: Build and publish
    needs: test           # a red test suite must never reach the NAS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # The Chromium-69 bundle for old Samsung TVs is generated by esbuild, a
      # devDependency the image does not install — so it has to be present in
      # the build context, and the Dockerfile only WARNS when it isn't. Building
      # it here rather than trusting the committed copy is what stops a stale
      # public/tv-build reaching a TV as a black screen after a frontend change.
      - run: npm ci
      - run: npm run build:tv

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          # Lowercased for us — GHCR rejects the capitals in the repo name.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      # Built locally FIRST so it can be booted before anyone sees it. The push
      # below reuses this exact cache, so it costs one build, not two.
      - uses: docker/build-push-action@v6
        with:
          context: .
          # The NAS is an N100. Building arm64 as well would roughly double the
          # run for an image nothing pulls.
          platforms: linux/amd64
          load: true
          push: false
          tags: mediawan:smoke
          # The apt layer (ffmpeg + the Intel VA-API stack) is minutes of the
          # build and changes about never. Cache it across runs.
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Does it actually start? A deploy nobody watches needs this: the image
      # can build perfectly and still die on boot, and the way that happens here
      # is a missing module — .gitignore kept lib/transcode/ and lib/cache/ out
      # of the repo entirely, and nothing noticed until CI could not load the
      # tests. `docker build` succeeding proves the layers assembled, not that
      # the module graph resolves.
      - name: Smoke test — the image boots and answers /healthz
        run: |
          set -euo pipefail
          docker run -d --name smoke -p 8787:8787 \
            -e ADMIN_EMAIL=smoke@example.invalid \
            -e ADMIN_PASSWORD=smoke-password-long-enough \
            -e DB_PATH=/tmp/smoke.sqlite \
            -e CACHE_DIR=/tmp/smoke-cache \
            mediawan:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8787/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"
              docker rm -f smoke >/dev/null
              exit 0
            fi
            # A container that has already exited will never become healthy.
            if [ "$(docker inspect -f '{{.State.Running}}' smoke)" != "true" ]; then
              break
            fi
            sleep 1
          done
          echo "::error::image did not answer /healthz — not publishing"
          docker logs smoke
          exit 1

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "### Published" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "Watchtower on the NAS picks this up within its poll interval." >> "$GITHUB_STEP_SUMMARY"
