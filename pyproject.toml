[project]
name = "mediawan"
version = "3.0.0"
description = "A self-hosted media server for the files on your own NAS."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  # The torrent sidecar (mediawan/torrentd.py) only; the web app never imports it.
  "libtorrent>=2.1.1",
]

[project.scripts]
mediawan = "mediawan.app:main"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mediawan"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# B008: FastAPI's Depends()/Body() defaults are the idiom. PLW1510: return codes are checked by hand.
ignore = ["B008", "PLW1510"]
