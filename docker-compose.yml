services:
  web:
    build: .
    image: mediawan:2-local
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      REAL_DEBRID_TOKEN: ${REAL_DEBRID_TOKEN:-}
      QBIT_URL: ${QBIT_URL:-}
      QBIT_USERNAME: ${QBIT_USERNAME:-}
      QBIT_PASSWORD: ${QBIT_PASSWORD:-}
      QBIT_SAVE_PATH: ${QBIT_SAVE_PATH:-/downloads}
      TORRENT_DIR: /media/torrents
      MEDIAWAN_DB: /data/mediawan-v2.sqlite
      LIBRARY_DIR: /media/library
      TRANSCODE_DIR: /runtime
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-0}
      IMPORT_ROOTS: /media
      CACHE_MAX_DOWNLOADS: ${CACHE_MAX_DOWNLOADS:-2}
      CACHE_RESERVE_BYTES: ${CACHE_RESERVE_BYTES:-21474836480}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${MEDIA_DIR:-./media}:/media
      - ${TRANSCODE_DIR:-./transcode}:/runtime
    ports:
      - "8787:8787"
      - "8788:8788"
  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [web]
