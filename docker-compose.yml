services:
  mediawan:
    build: .
    image: mediawan:3-local
    restart: unless-stopped
    # Root by default so the bind mounts are always writable. Set PUID/PGID to drop privileges
    # to a user that owns DATA_DIR and TRANSCODE_DIR.
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      # Folders inside the container, separated by ":". Name them like Movies / TV / Anime
      # and the scanner uses that as a hint.
      LIBRARY_ROOTS: ${LIBRARY_ROOTS:-/media}
      HWACCEL: ${HWACCEL:-qsv}
      MAX_TRANSCODES: ${MAX_TRANSCODES:-2}
      SCAN_INTERVAL_SECONDS: ${SCAN_INTERVAL_SECONDS:-21600}
      METADATA_ONLINE: ${METADATA_ONLINE:-true}
      NEWZNAB_INDEXERS: ${NEWZNAB_INDEXERS:-}
      USENET_DAV_URL: ${USENET_DAV_URL:-}
      USENET_DAV_API_KEY: ${USENET_DAV_API_KEY:-}
      USENET_DAV_USER: ${USENET_DAV_USER:-}
      USENET_DAV_PASSWORD: ${USENET_DAV_PASSWORD:-}
      USENET_DAV_CATEGORY: ${USENET_DAV_CATEGORY:-movies}
      # Torrent streaming: the torrent service below, reached through the vpn container
      # (set TORRENT_URL=http://vpn:8792 to turn it on). Empty = off.
      TORRENT_URL: ${TORRENT_URL:-}
      TORRENT_KEY: ${TORRENT_KEY:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-127.0.0.1}
      # Offered on every title; missing ones are translated by the libretranslate service.
      SUBTITLE_LANGUAGES: ${SUBTITLE_LANGUAGES:-ar,da,pt}
      TRANSLATE_URL: ${TRANSLATE_URL:-http://libretranslate:5000}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${MEDIA_DIR:-./media}:/media:ro # Mediawan never writes to your media
      - ${TRANSCODE_DIR:-./transcode}:/transcode
    # QuickSync: pass the GPU through, and join the groups that own it. Read the real GIDs on
    # the NAS with `stat -c '%g %G %n' /dev/dri/*` — a wrong render GID leaves the device
    # unopenable and every transcode falls back to software.
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-105}"
    ports:
      - "${PORT:-8787}:8787"

  # Machine translation for subtitles, on the NAS: nothing leaves your network. The first start
  # downloads the language models (a few hundred MB) into the named volume.
  libretranslate:
    image: libretranslate/libretranslate:v1.9.6
    restart: unless-stopped
    environment:
      # English is what most subtitles are translated from; keep it, and add a code here for
      # every language in SUBTITLE_LANGUAGES.
      LT_LOAD_ONLY: ${LT_LOAD_ONLY:-en,ar,da,pt}
      LT_THREADS: ${LT_THREADS:-2}
    volumes:
      - libretranslate-models:/home/libretranslate/.local

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on: [mediawan]

  # Optional NordVPN tunnel. It is off unless started with --profile vpn. The torrent service
  # joins it with network_mode: "service:vpn", so its traffic has no route but the tunnel.
  # Credentials are never written in this file or in .env; run ./vpn-credentials.sh, which
  # saves them in VPN_SECRETS_DIR, readable by root only.
  vpn:
    profiles: [vpn]
    image: qmcgaw/gluetun:v3.40.0
    restart: unless-stopped
    cap_add: [NET_ADMIN]
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      VPN_SERVICE_PROVIDER: nordvpn
      # openvpn = NordVPN service credentials; wireguard = a NordLynx private key
      VPN_TYPE: ${NORDVPN_TYPE:-openvpn}
      SERVER_COUNTRIES: ${NORDVPN_COUNTRY:-Netherlands}
      OPENVPN_USER_SECRETFILE: /run/secrets/vpn/openvpn_user
      OPENVPN_PASSWORD_SECRETFILE: /run/secrets/vpn/openvpn_password
      WIREGUARD_PRIVATE_KEY_SECRETFILE: /run/secrets/vpn/wireguard_private_key
      TZ: ${TZ:-Europe/Copenhagen}
      # Gluetun's firewall drops inbound connections; this lets Mediawan reach the torrent
      # service (which lives in this container's network) at http://vpn:8792. The port only
      # opens on the compose network side, never through the tunnel.
      FIREWALL_INPUT_PORTS: ${TORRENTD_PORT:-8792}
    volumes:
      - ${VPN_SECRETS_DIR:-./vpn-secrets}:/run/secrets/vpn:ro

  # Torrent streaming engine (mediawan/torrentd.py), from the same image. It shares the vpn
  # container's network, so peers only ever see the VPN's address: Gluetun's kill switch is
  # the guard, and the engine itself refuses to start torrents unless the tunnel is up.
  # Its cache lives under the transcode folder, capped, and is wiped on start and when idle.
  torrent:
    profiles: [vpn]
    build: .
    image: mediawan:3-local
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    network_mode: "service:vpn"
    command: ["python", "-m", "mediawan.torrentd"]
    environment:
      # The same long random string as Mediawan's TORRENT_KEY; without it the engine exits.
      TORRENT_KEY: ${TORRENT_KEY:-}
      TORRENTD_PORT: ${TORRENTD_PORT:-8792}
      TRANSCODE_DIR: /transcode
      TORRENT_CACHE_GB: ${TORRENT_CACHE_GB:-60}
      TORRENT_MIN_FREE_GB: ${TORRENT_MIN_FREE_GB:-10}
      TORRENT_UPLOAD_KBPS: ${TORRENT_UPLOAD_KBPS:-1024}
      TORRENT_INTERFACE: ${TORRENT_INTERFACE:-}
      TORRENT_BIND_TUNNEL: ${TORRENT_BIND_TUNNEL:-true}
      TORRENT_REQUIRE_VPN: "true"
    volumes:
      - ${TRANSCODE_DIR:-./transcode}:/transcode
    depends_on:
      vpn:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys,os; sys.exit(urllib.request.urlopen('http://127.0.0.1:%s/health' % os.environ.get('TORRENTD_PORT','8792')).status != 200)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  libretranslate-models:
