services:
  web:
    image: ghcr.io/marwansummakieh/mediawan:latest
    restart: unless-stopped
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      NODE_ENV: production
      DB_PATH: /data/data.sqlite
      TRUST_PROXY: "1"
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      REAL_DEBRID_TOKEN: ${REAL_DEBRID_TOKEN:-}
      PREMIUMIZE_API_KEY: ${PREMIUMIZE_API_KEY:-}
      CACHE_DIR: /media/cache
      CACHE_BUDGET_BYTES: ${CACHE_BUDGET_BYTES:-2199023255552}
      TRANSCODE_REMOTE_MBPS: ${TRANSCODE_REMOTE_MBPS:-6}
      TRANSCODE_MAX_SESSIONS: ${TRANSCODE_MAX_SESSIONS:-2}
      LAN_PORT: "8788"
      SEANIME_BASE: ${SEANIME_BASE-http://seanime:43211}
      SEANIME_PASSWORD: ${SEANIME_PASSWORD:-}
      SEANIME_PROVIDERS: ${SEANIME_PROVIDERS:-}
    volumes:
      - ${DATA_DIR:-./data}:/data
      - ${MEDIA_DIR:-./media}:/media
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${VIDEO_GID:-44}"
      - "${RENDER_GID:-104}"
    expose:
      - "8787"
    ports:
      - "8788:8788"

  seanime:
    image: umagistr/seanime:latest
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: ['exec /app/seanime --datadir /data --password "$$SEANIME_PASSWORD"']
    environment:
      SEANIME_PASSWORD: ${SEANIME_PASSWORD:?set SEANIME_PASSWORD in .env — Seanime rejects API calls without one}
      SEANIME_SERVER_HOST: 0.0.0.0
      SEANIME_SERVER_PORT: "43211"
    volumes:
      - ${DATA_DIR:-./data}/seanime:/data
    expose:
      - "43211"
    ports:
      - "${SEANIME_SETUP_PORT:-43211}:43211"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - web

  watchtower:
    image: containrrr/watchtower:latest
    restart: unless-stopped
    command: --label-enable --cleanup --interval ${DEPLOY_POLL_SECONDS:-300}
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
